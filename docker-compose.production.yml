services:
  outline:
    image: ghcr.io/chris1man/outline:sha-47a4664a29226081632650f9ad39b884e87b571c
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      URL: ${URL:?Set URL in the stack environment}
      PORT: ${PORT:-3000}
      FORCE_HTTPS: ${FORCE_HTTPS:-true}
      PROXY_HEADERS_TRUSTED: ${PROXY_HEADERS_TRUSTED:-true}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the stack environment}
      UTILS_SECRET: ${UTILS_SECRET:?Set UTILS_SECRET in the stack environment}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the stack environment}
      PGSSLMODE: ${PGSSLMODE:-disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      FILE_STORAGE: ${FILE_STORAGE:-local}
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FILE_STORAGE_UPLOAD_MAX_SIZE: ${FILE_STORAGE_UPLOAD_MAX_SIZE:-262144000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ru1}
      AWS_S3_UPLOAD_BUCKET_URL: ${AWS_S3_UPLOAD_BUCKET_URL:-https://s3.ru1.storage.beget.cloud}
      AWS_S3_UPLOAD_BUCKET_NAME: ${AWS_S3_UPLOAD_BUCKET_NAME:-1c7f38e5e349-docs}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-true}
      AWS_S3_ACL: ${AWS_S3_ACL:-private}
      AWS_S3_UPLOAD_METHOD: ${AWS_S3_UPLOAD_METHOD:-post}
      ENABLE_UPDATES: ${ENABLE_UPDATES:-true}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_TEAM_NAME: ${INITIAL_TEAM_NAME:-Outline}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - outline_data:/var/lib/outline/data
    networks:
      - default
      - nginx-proxy-manager_default

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: outline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: outline
    volumes:
      - outline_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outline -d outline"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - outline_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  outline_data:
  outline_postgres:
  outline_redis:

networks:
  nginx-proxy-manager_default:
    external: true
