name: Build container image

on:
  push:
    branches: [codex/email-password-auth-remote]

permissions:
  contents: write
  packages: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/chris1man/outline:email-password-auth
            ghcr.io/chris1man/outline:sha-${{ github.sha }}
      - name: Update deployment image tag
        run: |
          sed -i "s|image: ghcr.io/chris1man/outline:.*|image: ghcr.io/chris1man/outline:sha-${GITHUB_SHA}|" docker-compose.production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.production.yml
          git commit -m "ci: deploy ${GITHUB_SHA} [skip ci]"
          git push
      - name: Redeploy Outline
        run: >-
          curl --fail --show-error --silent --output /dev/null
          --write-out "Portainer webhook: HTTP %{http_code}\n"
          --request POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
