name: Build container image

on:
  push:
    branches: [codex/email-password-auth-remote]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/chris1man/outline:email-password-auth
      - name: Redeploy Outline
        run: >-
          curl --fail --show-error --silent --output /dev/null
          --write-out "Portainer webhook: HTTP %{http_code}\n"
          --request POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
